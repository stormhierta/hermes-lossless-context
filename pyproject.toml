[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-lossless-context"
version = "0.1.3"
description = "Opt-in Lossless Context Management addon for Hermes Agent"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Hermes Lossless Context contributors"}]
keywords = ["hermes-agent", "context", "compression", "memory", "sqlite", "fts5"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
dev = ["pytest>=7", "build>=1"]

[project.entry-points."hermes_agent.plugins"]
lossless_context = "lossless_context"

[tool.setuptools.packages.find]
include = ["lossless_context*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.data-files]
"share/hermes-lossless-context/skills/lossless-context" = ["skills/lossless-context/SKILL.md"]
"share/hermes-lossless-context/skills/lossless-context/references" = ["skills/lossless-context/references/architecture.md", "skills/lossless-context/references/tools.md"]
"share/hermes-lossless-context/plugin_entry" = ["plugin_entry/__init__.py", "plugin_entry/plugin.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
